---
# AlertManager Secret — configuração de receivers (PagerDuty + Discord)
# Aplicado via Terraform como kubernetes_secret_v1
# Este arquivo é documentação — o secret é criado pelo Terraform
#
# Estrutura do alertmanager-config:
#   route → receiver padrão: pagerduty
#   receivers: pagerduty + discord-webhook

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'pagerduty'
      routes:
        - matchers:
            - alertname =~ ".*"
          receiver: 'pagerduty'
        - matchers:
            - alertname =~ ".*"
          receiver: 'discord'

    receivers:
      - name: 'pagerduty'
        pagerduty_configs:
          - routing_key: '__PAGERDUTY_INTEGRATION_KEY__'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              namespace: '{{ .CommonLabels.namespace }}'
              service: '{{ .CommonLabels.service }}'
              severity: '{{ .CommonLabels.severity }}'

      - name: 'discord'
        webhook_configs:
          - url: '__DISCORD_WEBHOOK_URL__'
            send_resolved: true
            http_config: {}
            title: '{{ if eq .Status "firing" }}🔥 ALERTA DISPARADO{{ else }}✅ RESOLVIDO{{ end }}'
            text: |
              **{{ .CommonAnnotations.summary }}**
              {{ range .Alerts }}
              - **Serviço:** {{ .Labels.service }}
              - **Namespace:** {{ .Labels.namespace }}
              - **Severidade:** {{ .Labels.severity }}
              - **Descrição:** {{ .Annotations.description }}
              {{ end }}
