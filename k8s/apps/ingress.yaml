apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toggle-master-ingress
  namespace: auth-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # auth-service routes (/health, /validate, /admin/keys) don't
          # include an "/auth" prefix internally, so it must be stripped.
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          # targeting-service routes are /rules(/*), so stripping the
          # "/targeting" prefix lines up correctly.
          - path: /targeting(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: targeting-service-ext
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toggle-master-ingress-passthrough
  namespace: auth-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # flag-service routes are literally /flags and /flags/<name>,
          # so the prefix must NOT be stripped.
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service-ext
                port:
                  number: 80
          # evaluation-service's whole route is exactly /evaluate,
          # so the prefix must NOT be stripped.
          - path: /evaluate
            pathType: Prefix
            backend:
              service:
                name: evaluation-service-ext
                port:
                  number: 80
          - path: /analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-service-ext
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service-ext
  namespace: auth-service
spec:
  type: ExternalName
  externalName: flag-service.flag-service.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service-ext
  namespace: auth-service
spec:
  type: ExternalName
  externalName: targeting-service.targeting-service.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service-ext
  namespace: auth-service
spec:
  type: ExternalName
  externalName: evaluation-service.evaluation-service.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service-ext
  namespace: auth-service
spec:
  type: ExternalName
  externalName: analytics-service.analytics-service.svc.cluster.local
